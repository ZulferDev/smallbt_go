linters:
  enable:
    - errcheck
    - gofmt
    - goimports
    - govet
    - staticcheck
    - unused
  disable-all: false

linters-settings:
  errcheck:
    # Check only production code, not test code
    check-type-assertions: false
    check-blank: false
    # Exclude common cleanup functions
    exclude-functions:
      - (*os.File).Close
      - (*database/sql.Rows).Close
      - (*database/sql.Stmt).Close

issues:
  # Exclude all errcheck warnings in test files
  exclude-rules:
    - path: _test\.go$
      linters:
        - errcheck
    - path: _bench_test\.go$
      linters:
        - errcheck
    # Also exclude test directories
    - path: "internal/.*/.*_test\\.go"
      linters:
        - errcheck

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - third_party
  
output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
