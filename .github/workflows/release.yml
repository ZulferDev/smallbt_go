name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/trader-linux-amd64 ./cmd/trader
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/trader-linux-arm64 ./cmd/trader
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/trader-darwin-amd64 ./cmd/trader
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/trader-darwin-arm64 ./cmd/trader
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/trader-windows-amd64.exe ./cmd/trader

      - name: Create archive
        run: |
          cd dist
          tar -czvf trader-linux-amd64.tar.gz trader-linux-amd64
          tar -czvf trader-linux-arm64.tar.gz trader-linux-arm64
          tar -czvf trader-darwin-amd64.tar.gz trader-darwin-amd64
          tar -czvf trader-darwin-arm64.tar.gz trader-darwin-arm64
          zip trader-windows-amd64.zip trader-windows-amd64.exe

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.tar.gz,dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
