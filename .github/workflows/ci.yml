name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.22'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests with coverage
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...
        timeout-minutes: 5

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.txt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Code not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
          skip-cache: true

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test build
        run: |
          go build -o ./bin/trader ./cmd/trader
          ./bin/trader --help

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: go test ./tests/...

  validate-mvp:
    name: Validate MVP
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate CLI
        run: |
          go build -o ./bin/trader ./cmd/trader
          ./bin/trader validate --strategy strategies/examples/ema_volume.yaml

      - name: Run backtest example
        run: |
          go build -o ./bin/trader ./cmd/trader
          mkdir -p /tmp/test-backtest
          ./bin/trader backtest \
            --strategy strategies/examples/ema_volume.yaml \
            --data data/BTCUSDT.csv \
            --output /tmp/test-backtest/result.json

      - name: Verify output exists
        run: |
          test -f /tmp/test-backtest/result.json
          test -f /tmp/test-backtest/result.csv

      - name: Run optimize example
        run: |
          go build -o ./bin/trader ./cmd/trader
          ./bin/trader optimize \
            --strategy strategies/examples/ema_volume.yaml \
            --data data/BTCUSDT.csv \
            --output /tmp/test-backtest/optimize_result.json

      - name: Run walkforward example
        run: |
          go build -o ./bin/trader ./cmd/trader
          ./bin/trader walkforward \
            --strategy strategies/examples/ema_volume.yaml \
            --data data/BTCUSDT.csv \
            --output /tmp/test-backtest/walkforward_result.json

      - name: Run montecarlo example
        run: |
          go build -o ./bin/trader ./cmd/trader
          ./bin/trader montecarlo \
            --strategy strategies/examples/ema_volume.yaml \
            --data data/BTCUSDT.csv \
            --output /tmp/test-backtest/montecarlo_result.json

  benchmark:
    name: Performance Regression
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem ./internal/backtest > benchmarks.txt
        continue-on-error: true

      - name: Upload benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmarks.txt
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GoSec
        uses: securego/gosec@v2
        with:
          args: ./...

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify docs exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f ROADMAP.md
          test -f MVP_COMPLETION_REPORT.md
          test -f VERIFICATION_SUMMARY.txt
          test -d docs
          test $(ls -1 docs/*.md 2>/dev/null | wc -l) -ge 10
          test $(ls -1 strategies/examples/*.yaml 2>/dev/null | wc -l) -ge 10
